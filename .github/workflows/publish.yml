# Publishes the package to npm when a GitHub release is published.
# Requires the NPM_TOKEN repository secret (npm automation token). Until the
# secret is configured the job fails fast at the publish step — by design, so
# releases are an explicit, credentialed act.
name: Publish to npm
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
